<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Somify Agency AI Assistant" />

  <title>Somify AI Assistant</title>

  <link rel="stylesheet" href="/style.css" />
</head>

<body>

  <div class="app">

    <!-- Sidebar -->
    <aside class="sidebar">

      <img class="logo" src="logo.png" alt="">

      <div class="sidebar-content">

        <button id="newChatBtn" class="new-chat-btn">
          <span>＋</span>
          New Conversation
        </button>

        <div class="quick-section">

          <p class="section-title">
            QUICK SOLUTIONS
          </p>

          <button class="quick-btn" data-message="I run a school and need a school management system.">
            > School Management System
          </button>

          <button class="quick-btn" data-message="I need a system to manage my employees.">
            > Employee Management
          </button>

          <button class="quick-btn" data-message="I need a finance management system.">
            > Finance Management
          </button>

          <button class="quick-btn" data-message="I need a hospital management system.">
            > Hospital Management
          </button>

          <button class="quick-btn" data-message="I need an inventory management system.">
            > Inventory Management
          </button>

        </div>

      </div>

      <div class="sidebar-footer">
        <p>Powered by <a href="https://somifyagency.com">Somify Agency</a></p>
      </div>

    </aside>


    <!-- Main Chat -->
    <main class="chat-container">

      <!-- Header -->
      <header class="chat-header">

        <div class="assistant-info">

          <img class="icon" src="favicon.jpg" alt="">

          <div>
            <h2>Somify Assistant</h2>

            <div class="online-status">
              <span class="online-dot"></span>
              Online
            </div>
          </div>

        </div>

        <button id="clearBtn" class="clear-btn" title="Clear conversation">
          Clear
        </button>

      </header>


      <!-- Messages -->
      <section id="chatMessages" class="chat-messages">

        <div class="welcome">

          <h2>
            Welcome to Somify 👋
          </h2>

          <p>
            I'm Somify's AI assistant. I can help you find the right
            website, web application, or management system for your
            organization.
          </p>

          <div class="suggestions">

            <button class="suggestion" data-message="Tell me about Somify Agency.">
              What does Somify do?
            </button>

            <button class="suggestion" data-message="I need software for my school.">
              School solution
            </button>

            <button class="suggestion" data-message="I need software for my hospital.">
              Healthcare solution
            </button>

            <button class="suggestion" data-message="I need a website for my business.">
              Business website
            </button>

          </div>

        </div>

      </section>


      <!-- Typing indicator -->
      <div id="typingIndicator" class="typing-indicator hidden">

        <img class="icon" src="favicon.jpg" alt="">

        <div class="typing-bubble">
          <span></span>
          <span></span>
          <span></span>
        </div>

      </div>


      <!-- Input -->
      <footer class="input-area">

        <form id="chatForm">

          <div class="input-wrapper">

            <textarea id="messageInput" placeholder="Ask Somify anything..." rows="1" autocomplete="off"></textarea>

            <button id="sendBtn" type="submit" aria-label="Send message">
              ➤
            </button>

          </div>

          <p class="input-note">
            Somify AI can help you find the right digital solution.
          </p>

        </form>

      </footer>

    </main>

  </div>

  <script src="/app.js"></script>

</body>

</html>
